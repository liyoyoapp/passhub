<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6f7fb" />
<title>PassHub — 智能會員卡與優惠聚合錢包</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root { --accent: #4f46e5; }
  * { -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans TC', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: #f6f7fb;
    color: #0f172a;
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* ---------- 共用元件樣式 ---------- */
  .label { display: block; margin-bottom: .5rem; font-size: .8125rem; font-weight: 700; color: #334155; }
  .field {
    width: 100%; height: 3rem; border-radius: .9rem; border: 1px solid #e2e8f0;
    background: #fff; padding: 0 .9rem; font-size: .9375rem; color: #0f172a;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .field:focus { border-color: #a5b4fc; box-shadow: 0 0 0 4px rgba(99, 102, 241, .12); }
  .field::placeholder { color: #94a3b8; }

  .type-btn {
    border: 1.5px solid #e2e8f0; border-radius: 1rem; padding: .8rem .85rem;
    text-align: left; background: #fff; transition: all .15s; display: flex; gap: .65rem; align-items: flex-start;
  }
  .type-btn .t { font-size: .85rem; font-weight: 800; color: #334155; line-height: 1.2; }
  .type-btn .d { font-size: .7rem; color: #94a3b8; margin-top: .15rem; line-height: 1.3; }
  .type-btn .ic {
    width: 2rem; height: 2rem; flex: none; display: grid; place-items: center;
    border-radius: .65rem; background: #f1f5f9; color: #64748b; font-size: .85rem; transition: all .15s;
  }
  .type-btn.active { border-color: #4f46e5; background: #eef2ff; box-shadow: 0 8px 18px -12px rgba(79, 70, 229, .8); }
  .type-btn.active .t { color: #3730a3; }
  .type-btn.active .ic { background: #4f46e5; color: #fff; }

  .cat-btn {
    display: flex; flex-direction: column; align-items: center; gap: .35rem;
    border: 1.5px solid #e2e8f0; border-radius: 1rem; padding: .65rem .35rem;
    font-size: .8rem; font-weight: 600; color: #475569; background: #fff; transition: all .15s;
  }
  .cat-btn.active { border-color: #4f46e5; background: #eef2ff; color: #3730a3; }
  .cat-btn i { font-size: .95rem; }

  .chip {
    display: inline-flex; align-items: center; gap: .4rem; padding: .5rem .8rem;
    border-radius: 9999px; background: #fff; border: 1px solid #e2e8f0;
    font-size: .8125rem; font-weight: 600; color: #475569; white-space: nowrap;
    transition: all .15s;
  }
  .chip i { font-size: .7rem; opacity: .65; }
  .chip.active { background: #0f172a; border-color: #0f172a; color: #fff; box-shadow: 0 6px 14px -8px rgba(15, 23, 42, .7); }
  .chip.active i { opacity: .85; }

  .tab { height: 2.25rem; border-radius: .7rem; font-size: .8125rem; font-weight: 700; color: #64748b; transition: all .15s; }
  .tab.active { background: #fff; color: #0f172a; box-shadow: 0 1px 3px rgba(15, 23, 42, .12); }

  .card { transition: transform .15s ease, box-shadow .2s ease; cursor: pointer; }
  .card:hover { box-shadow: 0 18px 30px -18px rgba(15, 23, 42, .35); }
  .card:active { transform: scale(.975); }

  .modal-in { animation: modalIn .24s cubic-bezier(.22, 1, .36, 1); }
  @keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  @media (min-width: 640px) { @keyframes modalIn { from { opacity: 0; transform: translateY(-46%) scale(.97); } to { opacity: 1; transform: translateY(-50%) scale(1); } } }

  .fade-in { animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .toast {
    position: fixed; left: 50%; top: 1.25rem; z-index: 90;
    transform: translate(-50%, -12px); opacity: 0;
    padding: .6rem 1rem; border-radius: 9999px; font-size: .8125rem; font-weight: 700;
    color: #fff; box-shadow: 0 14px 30px -10px rgba(15, 23, 42, .45);
    transition: opacity .2s ease, transform .25s cubic-bezier(.22, 1, .36, 1);
    pointer-events: none; max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.success { background: #0f172a; }
  .toast.error { background: #e11d48; }
</style>
</head>
<body class="relative min-h-screen antialiased">

<div class="pointer-events-none absolute inset-x-0 top-0 h-72 bg-gradient-to-b from-indigo-100/80 via-violet-50/50 to-transparent"></div>

<div class="relative mx-auto max-w-5xl px-4 pb-16 sm:px-6">

  <!-- ============ Header ============ -->
  <header class="pt-6 sm:pt-8">
    <div class="flex items-start justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="grid h-11 w-11 place-items-center rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-500 text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-wallet text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl font-black tracking-tight text-slate-900 sm:text-2xl">PassHub</h1>
          <p class="text-[11px] text-slate-500 sm:text-xs">會員卡與優惠，一個 App 搞定</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="resetBtn" title="重設範本" aria-label="重設範本"
          class="grid h-10 w-10 place-items-center rounded-xl border border-slate-200 bg-white text-slate-500 shadow-sm transition hover:border-indigo-200 hover:text-indigo-600">
          <i class="fa-solid fa-rotate-left text-sm"></i>
        </button>
        <button id="addBtn"
          class="flex h-10 items-center gap-2 rounded-xl bg-slate-900 pl-3.5 pr-4 text-sm font-bold text-white shadow-lg shadow-slate-900/20 transition hover:bg-slate-800 active:scale-95">
          <i class="fa-solid fa-plus text-xs"></i>新增
        </button>
      </div>
    </div>

    <!-- Search -->
    <div class="relative mt-5">
      <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-sm text-slate-400"></i>
      <input id="searchInput" type="search" placeholder="搜尋商戶、分類或備註…" autocomplete="off"
        class="h-12 w-full rounded-2xl border border-slate-200 bg-white pl-11 pr-11 text-sm shadow-sm outline-none transition focus:border-indigo-300 focus:ring-4 focus:ring-indigo-500/10" />
      <button id="clearSearch" aria-label="清除搜尋"
        class="absolute right-3 top-1/2 hidden h-8 w-8 -translate-y-1/2 place-items-center rounded-full text-slate-400 transition hover:text-slate-600">
        <i class="fa-solid fa-circle-xmark"></i>
      </button>
    </div>

    <!-- Tabs -->
    <div class="mt-3 grid grid-cols-3 gap-1 rounded-2xl bg-slate-200/70 p-1">
      <button class="tab active" data-type-tab="all">全部</button>
      <button class="tab" data-type-tab="static">靜態碼</button>
      <button class="tab" data-type-tab="dynamic">動態連結</button>
    </div>

    <!-- Category chips -->
    <div id="filterChips" class="no-scrollbar -mx-4 mt-3 flex gap-2 overflow-x-auto px-4 pb-1 sm:mx-0 sm:px-0"></div>
  </header>

  <!-- ============ 卡片列表 ============ -->
  <main class="mt-4">
    <div class="mb-2 flex items-end justify-between">
      <h2 class="text-sm font-bold text-slate-500">我的錢包</h2>
      <p id="summary" class="text-[11px] font-medium text-slate-400"></p>
    </div>
    <div id="grid" class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4"></div>
  </main>

  <footer class="mt-10 text-center text-[11px] leading-relaxed text-slate-400">
    點擊卡片即可使用 · 資料儲存於此瀏覽器<br />
    PassHub © 2026
  </footer>
</div>

<!-- ============ 大螢幕掃描模式 ============ -->
<div id="viewer" class="fixed inset-0 z-50 hidden bg-white fade-in">
  <div class="mx-auto flex h-full max-w-2xl flex-col px-5 pb-6 pt-5">
    <div class="flex items-start justify-between gap-4">
      <div class="min-w-0">
        <p id="viewerType" class="text-[11px] font-bold tracking-widest text-indigo-500"></p>
        <h2 id="viewerName" class="mt-0.5 truncate text-2xl font-black text-slate-900"></h2>
        <p id="viewerNote" class="mt-1 truncate text-sm text-slate-500"></p>
      </div>
      <button id="viewerClose" aria-label="關閉"
        class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-slate-100 text-slate-600 transition hover:bg-slate-200">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <div class="flex min-h-0 flex-1 items-center justify-center py-6">
      <img id="viewerImg" alt="會員條碼" class="max-h-full max-w-full rounded-2xl object-contain ring-1 ring-slate-200 shadow-2xl" />
    </div>

    <div class="rounded-2xl bg-slate-50 px-4 py-3 text-center">
      <p class="text-sm font-bold text-slate-700"><i class="fa-solid fa-sun mr-1 text-amber-500"></i>已開啟高亮度掃描模式</p>
      <p class="mt-1 text-[11px] text-slate-500">請將畫面靠近掃描器，完成後按右上角關閉</p>
    </div>
  </div>
</div>

<!-- ============ 新增 / 編輯 ============ -->
<div id="editor" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm fade-in" data-action="close-editor"></div>
  <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[92vh] w-full flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl modal-in sm:inset-x-4 sm:bottom-auto sm:top-1/2 sm:max-h-[88vh] sm:max-w-lg sm:-translate-y-1/2 sm:rounded-3xl">
    <div class="flex items-center justify-between border-b border-slate-100 px-5 pb-3 pt-5">
      <h2 id="editorTitle" class="text-lg font-black text-slate-900">新增會員卡</h2>
      <button type="button" data-action="close-editor" aria-label="關閉"
        class="grid h-9 w-9 place-items-center rounded-full bg-slate-100 text-slate-500 transition hover:bg-slate-200">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <form id="cardForm" class="flex-1 space-y-4 overflow-y-auto px-5 py-4">
      <input type="hidden" id="editId" />

      <div>
        <span class="label">卡片類型</span>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" class="type-btn active" data-type-btn="static">
            <span class="ic"><i class="fa-solid fa-barcode"></i></span>
            <span>
              <span class="t block">靜態碼</span>
              <span class="d block">條碼 / QR Code</span>
            </span>
          </button>
          <button type="button" class="type-btn" data-type-btn="dynamic">
            <span class="ic"><i class="fa-solid fa-arrow-up-right-from-square"></i></span>
            <span>
              <span class="t block">動態連結</span>
              <span class="d block">跳轉優惠網頁</span>
            </span>
          </button>
        </div>
      </div>

      <div>
        <label class="label" for="cardName">商戶名稱 <span class="text-rose-500">*</span></label>
        <input id="cardName" class="field" maxlength="40" placeholder="例如：The Point" autocomplete="off" />
      </div>

      <div>
        <span class="label">分類</span>
        <div id="categoryPicker" class="grid grid-cols-3 gap-2"></div>
      </div>

      <div id="staticFields" class="space-y-2">
        <span class="label">條碼 / QR Code 圖片 <span class="text-rose-500">*</span></span>
        <div id="imageDrop"
          class="relative grid cursor-pointer place-items-center rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50 p-5 text-center transition hover:border-indigo-300 hover:bg-indigo-50/40">
          <div id="imagePlaceholder" class="space-y-1">
            <i class="fa-regular fa-image text-2xl text-slate-400"></i>
            <p class="text-sm font-bold text-slate-600">點擊上載或拍攝條碼</p>
            <p class="text-[11px] text-slate-400">支援 JPG / PNG · 建議裁掉多餘背景</p>
          </div>
          <div id="imagePreview" class="relative hidden w-full">
            <img id="imagePreviewImg" alt="條碼預覽" class="mx-auto max-h-48 rounded-xl object-contain" />
            <button type="button" id="removeImage" aria-label="移除圖片"
              class="absolute right-1 top-1 grid h-8 w-8 place-items-center rounded-full bg-white/95 text-slate-500 shadow transition hover:text-rose-500">
              <i class="fa-solid fa-trash-can text-xs"></i>
            </button>
          </div>
        </div>
        <input id="imageInput" type="file" accept="image/*" aria-label="上載條碼圖片" class="sr-only" />
      </div>

      <div id="dynamicFields" class="hidden">
        <label class="label" for="cardUrl">連結網址 <span class="text-rose-500">*</span></label>
        <input id="cardUrl" type="text" inputmode="url" class="field" placeholder="https://www.example.com" autocomplete="off" />
        <p class="mt-1.5 text-[11px] text-slate-400">未填寫 https:// 會自動補上</p>
      </div>

      <div>
        <label class="label" for="cardNote">備註（選填）</label>
        <input id="cardNote" class="field" maxlength="80" placeholder="例如：惠康 / Market Place 通用" autocomplete="off" />
      </div>
    </form>

    <div class="flex gap-3 border-t border-slate-100 bg-white p-4">
      <button type="button" id="deleteBtn"
        class="hidden h-12 shrink-0 items-center gap-2 rounded-xl bg-rose-50 px-4 text-sm font-bold text-rose-600 transition hover:bg-rose-100">
        <i class="fa-solid fa-trash-can"></i>刪除
      </button>
      <button type="submit" form="cardForm"
        class="h-12 flex-1 rounded-xl bg-slate-900 text-sm font-bold text-white shadow-lg shadow-slate-900/20 transition hover:bg-slate-800 active:scale-[.99]">
        儲存卡片
      </button>
    </div>
  </div>
</div>

<!-- ============ 確認對話框 ============ -->
<div id="confirm" class="fixed inset-0 z-[60] hidden">
  <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm fade-in" data-confirm="cancel"></div>
  <div class="absolute left-1/2 top-1/2 w-[86%] max-w-sm -translate-x-1/2 -translate-y-1/2 rounded-3xl bg-white p-6 text-center shadow-2xl modal-in">
    <div id="confirmIcon" class="mx-auto mb-4 grid h-12 w-12 place-items-center rounded-2xl text-lg">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h3 id="confirmTitle" class="text-lg font-black text-slate-900"></h3>
    <p id="confirmMsg" class="mt-2 text-sm leading-relaxed text-slate-500"></p>
    <div class="mt-6 grid grid-cols-2 gap-3">
      <button type="button" data-confirm="cancel"
        class="h-11 rounded-xl bg-slate-100 text-sm font-bold text-slate-700 transition hover:bg-slate-200">取消</button>
      <button type="button" id="confirmOk" data-confirm="ok"
        class="h-11 rounded-xl bg-slate-900 text-sm font-bold text-white shadow-lg shadow-slate-900/20 transition hover:bg-slate-800">確定</button>
    </div>
  </div>
</div>

<noscript>
  <div class="fixed inset-0 z-[100] grid place-items-center bg-white p-8 text-center">
    <p class="text-sm text-slate-600">PassHub 需要啟用 JavaScript 才能運作。</p>
  </div>
</noscript>

<script>
(function () {
  'use strict';

  /* ================= 常數與狀態 ================= */
  const STORAGE_KEY = 'passhub.cards.v1';

  const CATEGORIES = {
    mall:        { label: '商場', en: 'Mall',        icon: 'fa-store',          color: '#6366f1', soft: '#eef2ff' },
    supermarket: { label: '超市', en: 'Supermarket', icon: 'fa-cart-shopping',  color: '#10b981', soft: '#ecfdf5' },
    dining:      { label: '餐飲', en: 'Dining',      icon: 'fa-utensils',       color: '#f97316', soft: '#fff7ed' },
    transport:   { label: '交通', en: 'Transport',   icon: 'fa-train-subway',   color: '#0ea5e9', soft: '#f0f9ff' },
    other:       { label: '其他', en: 'Other',       icon: 'fa-tag',            color: '#64748b', soft: '#f8fafc' }
  };

  const state = { cards: [], query: '', type: 'all', category: 'all' };
  let editorType = 'static';
  let editorCategory = 'mall';
  let editingId = null;
  let imageData = null;
  let confirmResolver = null;
  let wakeLock = null;

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const grid = $('#grid');
  const viewer = $('#viewer');
  const editor = $('#editor');
  const confirmEl = $('#confirm');
  const searchInput = $('#searchInput');

  /* ================= 工具函式 ================= */
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  function catOf(key) {
    return CATEGORIES[key] || CATEGORIES.other;
  }

  function toast(message, type) {
    const el = document.createElement('div');
    el.className = 'toast ' + (type === 'error' ? 'error' : 'success');
    el.textContent = message;
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => el.classList.remove('show'), 1900);
    setTimeout(() => el.remove(), 2300);
  }

  /* ================= 示範資料 ================= */
  function makeBarcode(text) {
    let h = 2166136261;
    for (let i = 0; i < text.length; i++) {
      h ^= text.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    const rand = () => {
      h = Math.imul(h ^ (h >>> 15), 2246822507);
      h ^= h >>> 13;
      return ((h >>> 0) % 1000) / 1000;
    };

    let x = 9;
    let bars = '';
    while (x < 250) {
      const w = 1 + Math.floor(rand() * 4);
      bars += '<rect x="' + x + '" y="10" width="' + w + '" height="64" fill="#111"/>';
      x += w + 1 + Math.floor(rand() * 4);
    }

    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 98">' +
        '<rect width="260" height="98" fill="#ffffff"/>' + bars +
        '<text x="130" y="90" font-family="Menlo,monospace" font-size="12" text-anchor="middle" fill="#111" letter-spacing="2">' +
          text +
        '</text>' +
      '</svg>';

    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function demoCards() {
    const now = Date.now();
    return [
      { id: 'demo-point', type: 'static', name: 'The Point', category: 'mall',
        image: makeBarcode('TP 8821 4407 9930'), note: 'MOKO / APM 通用會員碼', createdAt: now - 6000 },
      { id: 'demo-yuu', type: 'static', name: 'yuu', category: 'supermarket',
        image: makeBarcode('YUU 3390 1128 7745'), note: '惠康、Market Place、7-Eleven', createdAt: now - 5000 },
      { id: 'demo-759', type: 'dynamic', name: '759 阿信屋', category: 'supermarket',
        url: 'https://www.759store.com', note: '每週會員優惠更新', createdAt: now - 4000 },
      { id: 'demo-kfc', type: 'dynamic', name: 'KFC 限時優惠', category: 'dining',
        url: 'https://www.kfchk.com', note: '期間限定套餐券', createdAt: now - 3000 },
      { id: 'demo-mcd', type: 'static', name: '麥當勞 App', category: 'dining',
        image: makeBarcode('MCD 9917 2204 5581'), note: 'McCafé 電子券', createdAt: now - 2000 },
      { id: 'demo-octopus', type: 'dynamic', name: '八達通 Octopus', category: 'transport',
        url: 'https://www.octopus.com.hk', note: '查閱餘額與自動增值', createdAt: now - 1000 }
    ];
  }

  /* ================= 儲存 ================= */
  function persist(cards) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
      return true;
    } catch (err) {
      toast('儲存空間不足，請改用較小的圖片', 'error');
      return false;
    }
  }

  function load() {
    const raw = localStorage.getItem(STORAGE_KEY);
    let cards = null;
    if (raw !== null) {
      try {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) cards = parsed;
      } catch (err) { /* 忽略壞資料，改用示範資料 */ }
    }
    if (cards === null) {
      cards = demoCards();
      persist(cards);
    }
    state.cards = cards;
  }

  /* ================= 畫面渲染 ================= */
  function cardHTML(card) {
    const cat = catOf(card.category);
    const isStatic = card.type === 'static';

    const thumb = isStatic
      ? (card.image
          ? '<img src="' + card.image + '" alt="' + escapeHtml(card.name) + '" loading="lazy" class="h-full w-full object-contain p-1.5" />'
          : '<div class="grid h-full w-full place-items-center" style="background:' + cat.soft + '">' +
              '<i class="fa-solid fa-barcode text-3xl" style="color:' + cat.color + '"></i></div>')
      : '<div class="relative grid h-full w-full place-items-center" style="background:linear-gradient(135deg,' + cat.soft + ',#ffffff)">' +
          '<div class="grid h-12 w-12 place-items-center rounded-2xl text-white shadow-lg" style="background:' + cat.color + '">' +
            '<i class="fa-solid ' + cat.icon + ' text-lg"></i>' +
          '</div>' +
          '<i class="fa-solid fa-arrow-up-right-from-square absolute bottom-2 right-2 text-[10px]" style="color:' + cat.color + '"></i>' +
        '</div>';

    return '' +
      '<article class="card group relative overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm" ' +
        'data-card="' + card.id + '" role="button" tabindex="0" aria-label="' + escapeHtml(card.name) + '">' +
        '<div class="relative aspect-[4/3] overflow-hidden border-b border-slate-100 bg-white">' +
          thumb +
          '<span class="absolute left-2 top-2 inline-flex items-center gap-1 rounded-full bg-white/95 px-2 py-1 text-[10px] font-bold text-slate-700 shadow-sm backdrop-blur">' +
            '<i class="fa-solid ' + (isStatic ? 'fa-barcode' : 'fa-arrow-up-right-from-square') + ' text-[9px] text-indigo-500"></i>' +
            (isStatic ? '靜態碼' : '動態連結') +
          '</span>' +
          '<button type="button" data-edit="' + card.id + '" aria-label="編輯 ' + escapeHtml(card.name) + '" ' +
            'class="absolute right-2 top-2 grid h-7 w-7 place-items-center rounded-full bg-white/95 text-slate-500 shadow-sm backdrop-blur transition hover:text-indigo-600">' +
            '<i class="fa-solid fa-ellipsis text-xs"></i>' +
          '</button>' +
        '</div>' +
        '<div class="px-3 pb-3 pt-2.5">' +
          '<p class="truncate text-sm font-bold text-slate-900">' + escapeHtml(card.name) + '</p>' +
          '<p class="mt-0.5 flex items-center gap-1 text-[11px] text-slate-500">' +
            '<span class="h-1.5 w-1.5 shrink-0 rounded-full" style="background:' + cat.color + '"></span>' +
            '<span class="shrink-0">' + cat.label + '</span>' +
            (card.note ? '<span class="truncate text-slate-400">· ' + escapeHtml(card.note) + '</span>' : '') +
          '</p>' +
        '</div>' +
      '</article>';
  }

  function emptyHTML() {
    if (state.cards.length === 0) {
      return '' +
        '<div class="col-span-full rounded-3xl border border-dashed border-slate-300 bg-white/70 px-6 py-12 text-center">' +
          '<div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-indigo-50 text-indigo-500">' +
            '<i class="fa-solid fa-wallet text-xl"></i></div>' +
          '<p class="mt-4 text-base font-black text-slate-800">錢包還是空的</p>' +
          '<p class="mt-1 text-sm text-slate-500">加入第一張會員卡，結帳時不再手忙腳亂。</p>' +
          '<button data-empty-action="add" class="mt-5 inline-flex h-11 items-center gap-2 rounded-xl bg-slate-900 px-5 text-sm font-bold text-white shadow-lg shadow-slate-900/20 transition hover:bg-slate-800">' +
            '<i class="fa-solid fa-plus text-xs"></i>新增第一張卡片</button>' +
        '</div>';
    }
    return '' +
      '<div class="col-span-full rounded-3xl border border-dashed border-slate-300 bg-white/70 px-6 py-12 text-center">' +
        '<i class="fa-solid fa-magnifying-glass text-2xl text-slate-300"></i>' +
        '<p class="mt-3 text-base font-black text-slate-800">找不到符合的卡片</p>' +
        '<p class="mt-1 text-sm text-slate-500">試試其他關鍵字，或清除篩選條件。</p>' +
        '<button data-empty-action="clear" class="mt-5 inline-flex h-11 items-center gap-2 rounded-xl bg-slate-900 px-5 text-sm font-bold text-white shadow-lg shadow-slate-900/20 transition hover:bg-slate-800">' +
          '<i class="fa-solid fa-rotate-left text-xs"></i>清除篩選</button>' +
      '</div>';
  }

  function render() {
    const q = state.query.trim().toLowerCase();

    const list = state.cards.filter((card) => {
      if (state.type !== 'all' && card.type !== state.type) return false;
      if (state.category !== 'all' && card.category !== state.category) return false;
      if (!q) return true;
      const haystack = [card.name, card.note || '', catOf(card.category).label, card.url || '']
        .join(' ').toLowerCase();
      return haystack.indexOf(q) !== -1;
    });

    grid.innerHTML = list.length ? list.map(cardHTML).join('') : emptyHTML();

    $('#summary').textContent = list.length === state.cards.length
      ? '共 ' + state.cards.length + ' 張卡片'
      : '顯示 ' + list.length + ' / ' + state.cards.length + ' 張';

    $$('.tab', document).forEach((tab) => {
      tab.classList.toggle('active', tab.dataset.typeTab === state.type);
    });

    $$('.chip', $('#filterChips')).forEach((chip) => {
      chip.classList.toggle('active', chip.dataset.category === state.category);
    });

    $('#clearSearch').classList.toggle('hidden', !state.query);
    $('#clearSearch').classList.toggle('grid', !!state.query);
  }

  /* ================= 篩選器建立 ================= */
  function buildFilterChips() {
    const items = [{ key: 'all', label: '全部', icon: 'fa-layer-group', color: '#0f172a' }]
      .concat(Object.keys(CATEGORIES).map((key) => ({
        key: key,
        label: CATEGORIES[key].label,
        icon: CATEGORIES[key].icon,
        color: CATEGORIES[key].color
      })));

    $('#filterChips').innerHTML = items.map((item) => (
      '<button type="button" class="chip' + (item.key === 'all' ? ' active' : '') + '" data-category="' + item.key + '">' +
        '<i class="fa-solid ' + item.icon + '" style="color:' + (item.key === 'all' ? 'currentColor' : item.color) + '"></i>' +
        item.label +
      '</button>'
    )).join('');
  }

  function buildCategoryPicker() {
    $('#categoryPicker').innerHTML = Object.keys(CATEGORIES).map((key) => {
      const cat = CATEGORIES[key];
      return '<button type="button" class="cat-btn' + (key === 'mall' ? ' active' : '') + '" data-cat-btn="' + key + '">' +
        '<i class="fa-solid ' + cat.icon + '" style="color:' + cat.color + '"></i>' +
        '<span>' + cat.label + '</span>' +
      '</button>';
    }).join('');
  }

  /* ================= 卡片操作 ================= */
  function openCard(id) {
    const card = state.cards.find((c) => c.id === id);
    if (!card) return;

    if (card.type === 'dynamic') {
      if (!card.url) {
        toast('這張卡片沒有有效連結', 'error');
        return;
      }
      const win = window.open(card.url, '_blank');
      if (!win) {
        toast('無法開啟連結，請允許彈出視窗', 'error');
      } else {
        try { win.opener = null; } catch (err) { /* 忽略 */ }
      }
      return;
    }

    openViewer(card);
  }

  /* ================= 掃描模式 ================= */
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch (err) { /* 部分瀏覽器不支援，忽略 */ }
  }

  async function releaseWakeLock() {
    try {
      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (err) { /* 忽略 */ }
  }

  function openViewer(card) {
    const cat = catOf(card.category);
    $('#viewerType').textContent = cat.label + ' · 靜態碼';
    $('#viewerName').textContent = card.name;
    $('#viewerNote').textContent = card.note || '請將條碼對準掃描器';
    $('#viewerImg').src = card.image || '';
    viewer.classList.remove('hidden');
    syncScrollLock();
    requestWakeLock();
  }

  function closeViewer() {
    viewer.classList.add('hidden');
    $('#viewerImg').removeAttribute('src');
    syncScrollLock();
    releaseWakeLock();
  }

  /* ================= 編輯器 ================= */
  function setType(type) {
    editorType = type === 'dynamic' ? 'dynamic' : 'static';
    $$('[data-type-btn]').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.typeBtn === editorType);
    });
    $('#staticFields').classList.toggle('hidden', editorType !== 'static');
    $('#dynamicFields').classList.toggle('hidden', editorType !== 'dynamic');
  }

  function setCategory(key) {
    editorCategory = CATEGORIES[key] ? key : 'mall';
    $$('[data-cat-btn]').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.catBtn === editorCategory);
    });
  }

  function renderImagePreview() {
    const hasImage = !!imageData;
    $('#imagePreview').classList.toggle('hidden', !hasImage);
    $('#imagePlaceholder').classList.toggle('hidden', hasImage);
    if (hasImage) $('#imagePreviewImg').src = imageData;
    else $('#imagePreviewImg').removeAttribute('src');
  }

  function openEditor(card) {
    editingId = card ? card.id : null;
    imageData = card && card.image ? card.image : null;

    $('#editorTitle').textContent = card ? '編輯會員卡' : '新增會員卡';
    $('#cardName').value = card ? card.name : '';
    $('#cardNote').value = card ? (card.note || '') : '';
    $('#cardUrl').value = card ? (card.url || '') : '';

    setCategory(card ? card.category : 'mall');
    setType(card ? card.type : 'static');
    renderImagePreview();

    const delBtn = $('#deleteBtn');
    delBtn.classList.toggle('hidden', !card);
    delBtn.classList.toggle('flex', !!card);

    editor.classList.remove('hidden');
    syncScrollLock();
    setTimeout(() => { if (window.innerWidth >= 640) $('#cardName').focus(); }, 150);
  }

  function closeEditor() {
    editor.classList.add('hidden');
    editingId = null;
    imageData = null;
    $('#cardForm').reset();
    syncScrollLock();
  }

  function syncScrollLock() {
    const anyOpen = !editor.classList.contains('hidden') ||
                    !viewer.classList.contains('hidden') ||
                    !confirmEl.classList.contains('hidden');
    document.body.style.overflow = anyOpen ? 'hidden' : '';
  }

  /* ================= 確認對話框 ================= */
  function confirmDialog(opts) {
    return new Promise((resolve) => {
      confirmResolver = resolve;
      $('#confirmTitle').textContent = opts.title;
      $('#confirmMsg').textContent = opts.message || '';

      const icon = $('#confirmIcon');
      icon.style.background = opts.danger ? '#ffe4e6' : '#eef2ff';
      icon.style.color = opts.danger ? '#e11d48' : '#4f46e5';

      const ok = $('#confirmOk');
      ok.textContent = opts.confirmText || '確定';
      ok.className = 'h-11 rounded-xl text-sm font-bold text-white shadow-lg transition ' +
        (opts.danger
          ? 'bg-rose-500 shadow-rose-500/25 hover:bg-rose-600'
          : 'bg-slate-900 shadow-slate-900/20 hover:bg-slate-800');

      confirmEl.classList.remove('hidden');
      syncScrollLock();
    });
  }

  function settleConfirm(value) {
    confirmEl.classList.add('hidden');
    syncScrollLock();
    const resolve = confirmResolver;
    confirmResolver = null;
    if (resolve) resolve(value);
  }

  /* ================= 圖片處理 ================= */
  function fileToDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read-error'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('image-error'));
        img.onload = () => {
          const MAX = 1200;
          const scale = Math.min(1, MAX / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', 0.9));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function handleImageFile(file) {
    if (!file.type || file.type.indexOf('image/') !== 0) {
      toast('請選擇圖片檔案', 'error');
      return;
    }
    try {
      toast('正在處理圖片…');
      imageData = await fileToDataURL(file);
      renderImagePreview();
      toast('圖片已加入');
    } catch (err) {
      toast('圖片讀取失敗，請改用其他檔案', 'error');
    }
  }

  /* ================= 表單送出 ================= */
  function handleSubmit(event) {
    event.preventDefault();

    const name = $('#cardName').value.trim();
    const note = $('#cardNote').value.trim();
    const category = editorCategory;
    let url = '';
    let image = '';

    if (!name) {
      toast('請輸入商戶名稱', 'error');
      $('#cardName').focus();
      return;
    }

    if (editorType === 'static') {
      if (!imageData) {
        toast('請上載條碼或 QR Code 圖片', 'error');
        return;
      }
      image = imageData;
    } else {
      let raw = $('#cardUrl').value.trim();
      if (!raw) {
        toast('請輸入連結網址', 'error');
        $('#cardUrl').focus();
        return;
      }
      if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw;
      try {
        const parsed = new URL(raw);
        if (!parsed.hostname || parsed.hostname.indexOf('.') === -1) throw new Error('bad');
        url = parsed.href;
      } catch (err) {
        toast('網址格式不正確', 'error');
        $('#cardUrl').focus();
        return;
      }
    }

    const wasEditing = !!editingId;
    let next;

    if (editingId) {
      next = state.cards.map((card) => card.id === editingId
        ? Object.assign({}, card, {
            name: name, note: note, category: category, type: editorType,
            image: image, url: url, updatedAt: Date.now()
          })
        : card);
    } else {
      next = [{
        id: 'c_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        name: name, note: note, category: category, type: editorType,
        image: image, url: url, createdAt: Date.now()
      }].concat(state.cards);
    }

    if (!persist(next)) return;

    state.cards = next;
    closeEditor();
    render();
    toast(wasEditing ? '已更新卡片' : '已新增卡片');
  }

  /* ================= 刪除 / 重設 ================= */
  async function deleteCurrent() {
    if (!editingId) return;
    const card = state.cards.find((c) => c.id === editingId);
    const ok = await confirmDialog({
      title: '刪除這張卡片？',
      message: '「' + (card ? card.name : '') + '」將會從錢包移除，此操作無法復原。',
      confirmText: '刪除',
      danger: true
    });
    if (!ok) return;

    const next = state.cards.filter((c) => c.id !== editingId);
    if (!persist(next)) return;

    state.cards = next;
    closeEditor();
    render();
    toast('已刪除卡片');
  }

  async function resetDemo() {
    const ok = await confirmDialog({
      title: '重設為示範資料？',
      message: '目前的卡片會被示範內容取代，此操作無法復原。',
      confirmText: '重設',
      danger: true
    });
    if (!ok) return;

    const demo = demoCards();
    if (!persist(demo)) return;

    state.cards = demo;
    state.type = 'all';
    state.category = 'all';
    state.query = '';
    searchInput.value = '';
    render();
    toast('已重設為示範資料');
  }

  /* ================= 事件綁定 ================= */
  function bindEvents() {
    // 搜尋
    searchInput.addEventListener('input', () => {
      state.query = searchInput.value;
      render();
    });
    $('#clearSearch').addEventListener('click', () => {
      searchInput.value = '';
      state.query = '';
      render();
      searchInput.focus();
    });

    // 類型分頁
    $$('[data-type-tab]').forEach((tab) => {
      tab.addEventListener('click', () => {
        state.type = tab.dataset.typeTab;
        render();
      });
    });

    // 分類 chip
    $('#filterChips').addEventListener('click', (event) => {
      const chip = event.target.closest('[data-category]');
      if (!chip) return;
      state.category = chip.dataset.category;
      render();
    });

    // 卡片網格
    grid.addEventListener('click', (event) => {
      const emptyAction = event.target.closest('[data-empty-action]');
      if (emptyAction) {
        if (emptyAction.dataset.emptyAction === 'add') {
          openEditor(null);
        } else {
          state.query = '';
          state.type = 'all';
          state.category = 'all';
          searchInput.value = '';
          render();
        }
        return;
      }

      const editBtn = event.target.closest('[data-edit]');
      if (editBtn) {
        event.stopPropagation();
        const card = state.cards.find((c) => c.id === editBtn.dataset.edit);
        if (card) openEditor(card);
        return;
      }

      const cardEl = event.target.closest('[data-card]');
      if (cardEl) openCard(cardEl.dataset.card);
    });

    grid.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      const cardEl = event.target.closest('[data-card]');
      if (!cardEl) return;
      event.preventDefault();
      openCard(cardEl.dataset.card);
    });

    // 新增 / 重設
    $('#addBtn').addEventListener('click', () => openEditor(null));
    $('#resetBtn').addEventListener('click', resetDemo);

    // 掃描模式
    $('#viewerClose').addEventListener('click', closeViewer);

    // 編輯器
    $$('[data-action="close-editor"]').forEach((el) => {
      el.addEventListener('click', closeEditor);
    });
    $$('[data-type-btn]').forEach((btn) => {
      btn.addEventListener('click', () => setType(btn.dataset.typeBtn));
    });
    $('#categoryPicker').addEventListener('click', (event) => {
      const btn = event.target.closest('[data-cat-btn]');
      if (btn) setCategory(btn.dataset.catBtn);
    });

    // 圖片上載
    $('#imageDrop').addEventListener('click', () => $('#imageInput').click());
    $('#imageDrop').addEventListener('dragover', (event) => {
      event.preventDefault();
      $('#imageDrop').classList.add('border-indigo-400', 'bg-indigo-50/60');
    });
    $('#imageDrop').addEventListener('dragleave', () => {
      $('#imageDrop').classList.remove('border-indigo-400', 'bg-indigo-50/60');
    });
    $('#imageDrop').addEventListener('drop', async (event) => {
      event.preventDefault();
      $('#imageDrop').classList.remove('border-indigo-400', 'bg-indigo-50/60');
      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      if (!file) return;
      await handleImageFile(file);
    });
    $('#imageInput').addEventListener('change', async (event) => {
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (file) await handleImageFile(file);
    });
    $('#removeImage').addEventListener('click', (event) => {
      event.stopPropagation();
      imageData = null;
      renderImagePreview();
    });

    // 表單
    $('#cardForm').addEventListener('submit', handleSubmit);
    $('#deleteBtn').addEventListener('click', deleteCurrent);

    // 確認框
    confirmEl.addEventListener('click', (event) => {
      const target = event.target.closest('[data-confirm]');
      if (!target) return;
      settleConfirm(target.dataset.confirm === 'ok');
    });

    // 鍵盤
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (!confirmEl.classList.contains('hidden')) { settleConfirm(false); return; }
      if (!viewer.classList.contains('hidden')) { closeViewer(); return; }
      if (!editor.classList.contains('hidden')) { closeEditor(); }
    });

    // 回到前景時重新取得螢幕喚醒
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !viewer.classList.contains('hidden')) {
        requestWakeLock();
      }
    });
  }

  /* ================= 啟動 ================= */
  buildFilterChips();
  buildCategoryPicker();
  load();
  bindEvents();
  render();
})();
</script>
</body>
</html>
